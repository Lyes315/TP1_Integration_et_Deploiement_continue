services:
  web:
    build: .
    container_name: mon_flask
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017/
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: mon_mongo
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
